# CrewForge5 project configuration: the only config file (read by every stage; commit it).
# Every layer has one off switch here and one environment variable (CREWFORGE5_<LAYER>=off).

[project]
home = "crewforge5"         # feature folders live in <home>/<slug>/; CREWFORGE5_HOME overrides

[commands]
test = ""                   # the project's test command; `build red` needs it to fail, `build green` to pass
lint = ""                   # optional; `review run` runs test, lint and build and writes test-report.json
build = ""                  # optional

[build]
require_adversarial_stamp = false   # `build check` needs an adversarial-review stamp in plan.md when true
protected_paths = []        # globs the pre-edit hook never lets Claude edit, e.g. "src/gen/**"
test_globs = ["tests/**", "test/**", "test_*.py", "*_test.py", "*_test.go", "*.test.*", "*.spec.*", "*.bats"]   # read-only while `build fix on`

[evals]
threshold = 1.0             # minimum pass rate of evals/*.json for `review evals`

[hooks]
enabled = true              # guardrail hooks (pre/post-edit, bash-guard, learn-capture, learn-nudge) in this project; CREWFORGE5_HOOKS=off in settings.json env also disables

[checkpoint]
enabled = true              # commit the stage's output at each accept; CREWFORGE5_CHECKPOINT=off also disables
paths = [".crewforge5.toml"]   # committed alongside the home directory; git-ignored entries are skipped

[workflows]
enabled = true              # commands run the read-only stage workflows (crewforge5:<name>); CREWFORGE5_WORKFLOWS=off also disables
auto_env = true             # session start merges [workflows.env] into .claude/settings.local.json

[workflows.env]
CLAUDE_CODE_WORKFLOWS = "1" # only CLAUDE_CODE_WORKFLOW* keys are accepted; anything else is refused
